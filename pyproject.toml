[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-lab"
version = "0.1.0"
description = "Learned models: fit and evaluate surrogates, physics-informed fields, learned laws, inverse problems."
readme = "README.md"
# Bounded above by the newest CPython every locked wheel covers: openvino 2026.4.1 ships cp313/cp314 only, and an
# open range let a runner pick 3.15 and fail to install (learn-lab#1, 2026-11-09). Raise it with the lock.
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mingyang Bao" }]
# The public boundary speaks numpy only. torch is the [torch] extra, imported only inside learn_lab.deep
# (tests/architecture/test_the_layers_point_one_way.py), so the response models never load it. The response
# models solve through numerics-lab (the family's equation-solving engine) and read scipy.special only.
dependencies = [
    "numerics-lab @ git+https://github.com/DawnEver/numerics-lab.git",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# learn_lab.deep's records -- the fit checkpoint and the inference export's manifest -- are TOML (family ruling
# 2026-11-25), written by tomlkit -- the family's TOML writer (lab-commons[io]) -- and read by stdlib tomllib.
torch = ["torch>=2.7", "tomlkit"]
# Inference export (learn_lab.deep.export): ONNX through torch, post-training quantization and the CPU/iGPU/NPU
# runtime through OpenVINO + NNCF. Inference only; training stays on torch.
# Export runs through torch, so the extra carries it: the openvino need is served whole by this one extra.
openvino = ["learn-lab[torch]", "onnx", "openvino", "nncf"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    # Reference oracles for the self-implemented response models: tests only, never runtime.
    "scikit-learn",
    # The family development system (verify door, rules, hooks). DEV ONLY: learn_lab imports neither dev_lab nor
    # lab_commons. [test] brings the JS engine the agent-guard tests run the guard in (dev_lab.dev.jsrun).
    "dev-lab[test] @ git+https://github.com/DawnEver/dev-lab.git",
]

# One CUDA build serves both platforms: native Windows CUDA (workstations, incl. Blackwell sm_120 which needs
# CUDA >= 12.8; cu130 builds cover it and Ada sm_80) and Linux (Ada A100/H200). macOS falls through to PyPI's CPU wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]
xfail_strict = true
markers = [
    "torch: needs the [torch] extra (imports torch or learn_lab.deep); its part is tests/torch",
    "openvino: needs the [openvino] extra (onnx, openvino, nncf and torch); its part is tests/openvino",
]

[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
# The install is derived per need-set from [tool.dev_lab.dep] (lab_commons.extras.sync_command).
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['src']
collect = 'tests'

[tool.dev_lab.parts]
output = "output/logs"
# torch and openvino are extras no hosted runner has until its part's job syncs them: each part runs in its own
# hosted job, on every event, so the deep tests stay on the GitHub gate (jobparts.runner_for alone would drop them).
hosted = { torch = { setup = "uv sync --frozen --group dev --extra torch" }, openvino = { setup = "uv sync --frozen --group dev --extra openvino" } }

# One verify worker's measured peak: a CUDA torch process commits ~3.3 GB (test_graph, 2026-11-08), so the
# 1 GB unmeasured floor got every deep test killed 0xC0000017 (out of memory) by the box.
[tool.dev_lab.verify]
worker_mem = "3.5 GiB"
# The one test that needs a CUDA device. GitHub's hosted runners have none and no GPU host produces parts for this
# repo, so it runs where a GPU is (a workstation's verify) and is declared here rather than truncating tests/base
# (user ruling 2026-11-09). Every other CUDA path is exercised on the CPU runtime. verify reads this list; the
# part poster reads the test's not_applicable marker (lab_commons.hpc.pytest_item): the family checks a skip at both.
allowed_skips = ["tests/unit/deep/test_artifact.py::test_a_fit_saved_on_cuda_loads_on_cuda_exactly_and_on_the_cpu_within_float32"]

[tool.lab_commons.tests]
# A marker naming what an environment may lack; a part is its need-set. torch and openvino are extras, mapped
# under [tool.dev_lab.dep] needs; tests/architecture/test_every_test_declares_its_needs.py keeps every importer marked.
resources = ["openvino", "torch"]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]

[tool.dev_lab.dep]
# No extra by default (user ruling 2026-11-21): torch and openvino install only where a part's need asks for them.
extras = []
needs = { torch = "torch", openvino = "openvino" }

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# on a full forge PASS. Past c623e25 (integrate/main created at the founding commits) every commit is a forge merge.
[tool.dev_lab.integrator]
trunk = "main"
integration = "integrate/main"
merges_only_since = "8be94e3889513c57967f1c4bc8f891512fac5a7a"  # INTEGRATION-IS-MERGES-ONLY after the founding commits
pr_merges_since = "c623e25949988135489296ad4562d05334a0dcec"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES after the integration branch was created

# FORGE-PROTECTION-DECLARED (dev_lab.dev.forgeprotect): the bypass identities per forge; on GitHub the
# ops App and the repo admin (integrator ruling 2026-11-10). `python -m dev_lab.dev.forge protect plan|check|apply`.
[tool.dev_lab.protection]
[tool.dev_lab.protection.forges."github.com"]
breakglass = ["app:5704921", "role:admin"]  # the ops App (motronics-ops) merges break-glass; admin stays

# GitHub Actions: the family's one PR lifecycle (dev_lab/dev/ci_base.toml) as is; rendered to
# .github/workflows/ci.yml by `python -m dev_lab.dev.ciworkflows render`, never hand-edited.
[tool.dev_lab.ci."ci.yml"]

# Git hooks: the family base (dev_lab/dev/githooks/base.toml) as is; learn-lab adds no row.
[tool.dev_lab.hooks]

[tool.dev_lab.branchset]
trunk = 'main'
sessions = ['integrate/main']
ephemeral = ['pr/*']  # a PR head: deleted with its merge
prune_merged = true
max_ahead = 30  # an unlanded branch holding more than 30 commits integration lacks is an alarm
max_idle = "24 h"  # a branch idle 24 h is pruned when merged, alarmed when not

[tool.dev_lab.doors]
BARE-TEST-INVOCATION = "<venv python> -m dev_lab.dev.verify -- <paths>  (the measure door; a full run is the forge producer's; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "push without skipping the hook; no hook runs a test, and the forge produces the part"
NETWORK-VERB = "<venv python> -m dev_lab.dev.netverb -- <git push|fetch|pull|clone|ls-remote|submodule update ...  or  uv lock|add|remove ...>  (retries 3x, then reports a diagnosis); an environment change is <venv python> -m dev_lab.dev.dep --sync, which retries inside"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m dev_lab.dev.dep --bootstrap <this checkout>  (run from this checkout; the extras are [tool.dev_lab.dep]'s, and a relock is --lock-upgrade <this checkout>)"

# The family files famfiles renders read their per-repo deltas from this one module.
[tool.dev_lab.render]
deltas = "tests/architecture/_famconfig.py"
adoption = "scripts/deny_rules.py"

# Who reviews this repo's PRs: the family's isolated judge host (user ruling 2026-11-10), gated on GitHub by the
# family App's review/judge check run. Keys and defaults: dev_lab.dev.forgereview_declared.
[tool.dev_lab.review]
judge_app = 5619495

# DECLARED-LAYOUT (dev_lab.dev.layout): the WHOLE tree as an allow-list -- each directory pattern (one glob per
# segment; the deepest matching row judges) and the formats a file there may be ('.suffix', an exact name, "" for
# none, "*" for anything). Undeclared is refused. NO-BACKUP-COPIES: nothing under output/ or scratch/ is ever a
# clone, worktree, exported tree, bundle or patch, whatever a row says. Formats (R3): TOML declarations, JSONL
# machine records, CSV tables, NPZ arrays, Markdown reports, PNG figures; vendor-native only at an adapter boundary.
[tool.dev_lab.placement]
# A worktree is a real second tree, judged by the run inside it.
pruned_paths = ['.claude/worktrees']

[tool.dev_lab.placement.layout]
'.' = ['.md', '.toml', '.lock', '.gitattributes', '.gitignore', 'license', 'makefile']
'.claude' = ['.json']
'.claude/hooks' = ['.js', '.json']
'.claude/memory' = ['.md']
'.claude/rules' = ['.md']
'.claude/tasks' = ['.md']
'.codex' = []
'.codex/rules' = ['.rules']
'.github' = []
'.github/workflows' = ['.yml']
'.vscode' = ['.json']
'docs-src' = ['.md']
'output' = []
'output/forge' = []
'output/forge/*' = ['.json', '.tmp']
'output/logs' = []
'output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/*' = ['.log', '.jsonl', '.json', '.gz', '.coverage', '.txt', '.csv', '.md', '.npz', '.png']
'output/runcache' = ['.jsonl']
'scratch' = ['*']
'scripts' = ['.py']
'src' = ['.py']
'tests' = ['.py']

# The family lint and format rules, as numerics-lab carries them.
[tool.ruff]
target-version = "py313"
line-length = 120
unsafe-fixes = false  # an unsafe fix rewrote a loss lambda into a stale bound method (2026-11-07)
src = ["src", "tests"]
exclude = [
    ".claude/memory",
    ".venv*",
    ".git",
]

[tool.ruff.lint]
preview = false
select = ["AIR", "ERA", "YTT", "ANN", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "FIX", "FA", "INT", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "SLOT", "TID", "TD", "ARG", "PTH", "FLY", "I", "C90", "NPY", "PD", "N", "PERF", "E", "W", "D", "F", "PGH", "PLC", "PLE", "PLR", "PLW", "UP", "FURB", "RUF", "TRY"]
ignore = [
    # PLR0917 -- too-many-positional-arguments: off, as in the family siblings.
    "PLR0917",
    "ANN002",   # Missing type annotation for *args
    "ANN003",   # Missing type annotation for **kwargs
    "ANN202",   # Missing return type annotation for private function
    "ARG002",   # Unused method argument
    "B904",     # raise ... from err in except clause
    "C901",     # Function too complex
    "COM812",
    "D105",     # Missing docstring in magic method
    "D205",     # 1 blank line required between summary line and description
    "D400",     # First line should end with a period
    "D415",     # Missing terminal punctuation
    "D417",     # Missing argument description in docstring
    "DTZ005",   # datetime.now() without tz argument
    "E501",     # Line too long
    "FBT",      # Boolean trap
    "LOG015",   # Call on root logger
    "N801",     # Class name should use CapWords
    "N802",     # Function name should be lowercase
    "N803",     # Argument name should be lowercase
    "N805",     # First argument of a method should be named self
    "N815",     # Variable in class scope should not be mixedCase
    "N816",     # Variable in global scope should not be mixedCase
    "N818",     # Exception name should end with Error
    "S101",     # Use of assert
    "S311",     # Standard pseudo-random generators
    "S603",     # subprocess without shell=True
    "SIM108",   # Use ternary instead of if-else
    "SLF001",   # Private member accessed
    "RUF002",   # Docstring contains ambiguous unicode — math notation (×, ν, λ) is legitimate
    "RUF003",   # Comment contains ambiguous unicode — math notation is legitimate
    "RUF012",   # Mutable class attributes should be annotated
    "RUF043",   # Pattern contains metacharacters but is neither escaped nor raw
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PT012",    # pytest.raises() block should contain a single simple statement
    "PT018",    # Assertion should be broken down into multiple parts
    "Q000",     # Single quotes found but double quotes preferred (incompatible with the formatter)
    "Q003",     # Change outer quotes to avoid escaping inner quotes (incompatible with the formatter)
    "UP017",    # Use datetime.UTC alias
    "ANN201",   # Missing return type annotation for public function -- TODO: remove this rule and the next ones
    "ANN206",   # Missing return type annotation for classmethod
    "ANN001",   # Missing type annotation for function argument
    "B018",     # Found useless expression
    "B023",     # Function does not bind loop variable — intentional closures in math code
    "D203",
    "D100",     # Missing docstring in public module
    "D101",     # Missing docstring in public class
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in __init__
    "D213",     # Multi-line docstring summary should start at the second line
    "D401",     # First line should be in imperative mood
    "ERA001",   # Found commented-out code
    "N806",     # Variable in function should be lowercase
    "PLR2004",  # Magic value used in comparison
    "PLW2901",  # Loop variable overwritten by assignment target
    "SIM113",   # Use enumerate for index variable
    "TRY300",   # Consider moving statement to else block
    "NPY002",   # Replace legacy np.random.rand with np.random.Generator
    "INP001",   # Implicit namespace package
    "TD",       # TODO
    "FIX",      # FIXME
    "EXE",
]

[tool.ruff.lint.per-file-ignores]
# EMPTY BY PRINCIPLE (2026-08-02, user directive) -- a waiver belongs in the file it
# governs, never in this central table:
#   * whole-file need   -> a `# ruff: noqa: RULE -- measured reason` header in that file
#   * single site       -> an inline `# noqa: RULE -- reason` at the site
#   * trivially fixable -> FIXED, never suppressed anywhere (T201 was the 85-print lesson)
# Why not a central table: (1) the waiver outlives the sin -- this table waived PLC0415
# for jmag/validation.py and edge3d/mesh.py while ruff reported ZERO hits in src/, so it
# silently covered any FUTURE lazy import; (2) the reason lives away from the code a
# reader is reading; (3) a central list drifts, and every hand-written list in this repo
# drifted. Enforced by tests/architecture/ratchets/test_suppression_ratchet.py, which pins
# this table's (file, rule) PAIRS at ZERO. That pin is the ONLY claim here anything checks:
# it does not read noqa reasons, so no line here may assert that it does.

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
