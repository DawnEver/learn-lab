[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-lab"
version = "0.1.0"
description = "Learned models: fit and evaluate surrogates, physics-informed fields, learned laws, inverse problems."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mingyang Bao" }]
# The public boundary speaks numpy only. torch is the [torch] extra, imported only inside learn_lab.deep
# (tests/architecture/test_layers.py), so the classical models never load it.
dependencies = ["numpy"]

[project.optional-dependencies]
torch = ["torch>=2.7"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    # The family development system (verify door, rules, hooks). DEV ONLY: learn_lab imports neither dev_lab nor
    # lab_commons. [test] brings the JS engine the agent-guard tests run the guard in (dev_lab.dev.jsrun).
    "dev-lab[test] @ git+https://github.com/DawnEver/dev-lab.git",
]

# One CUDA build serves both platforms: native Windows CUDA (workstations, incl. Blackwell sm_120 which needs
# CUDA >= 12.8) and Linux (Ada A100/H200). macOS falls through to PyPI's CPU wheel.
[tool.uv.sources]
# dev-lab floats on integrate/main like every family repo; the lock is the pin.
dev-lab = { git = "https://github.com/DawnEver/dev-lab.git", branch = "integrate/main" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]
xfail_strict = true

[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
install = 'uv sync --frozen --group dev --extra torch'
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['src']
collect = 'tests'

[tool.dev_lab.parts]
output = "output/logs"

[tool.lab_commons.tests]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# on a full forge PASS. pr_merges_since is the last founding commit: every commit after it is a forge merge.
[tool.dev_lab.integrator]
trunk = "main"
integration = "integrate/main"
pr_merges_since = "8be94e3889513c57967f1c4bc8f891512fac5a7a"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES after the founding commits

# GitHub Actions: the family's one PR lifecycle (dev_lab/dev/ci_base.toml) as is; rendered to
# .github/workflows/ci.yml by `python -m dev_lab.dev.ciworkflows render`, never hand-edited.
[tool.dev_lab.ci."ci.yml"]

# Git hooks: the family base (dev_lab/dev/githooks/base.toml) as is; learn-lab adds no row.
[tool.dev_lab.hooks]

[tool.dev_lab.branchset]
trunk = 'main'
sessions = ['integrate/main']
ephemeral = ['pr/*']
prune_merged = true

[tool.dev_lab.doors]
BARE-TEST-INVOCATION = "<venv python> -m dev_lab.dev.verify -- <paths>  (the measure door; a full run is the forge producer's; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "push without skipping the hook; no hook runs a test, and the forge produces the part"
NETWORK-VERB = "<venv python> -m dev_lab.dev.netverb -- <git push|fetch|pull|clone|ls-remote|submodule update ...  or  uv lock|add|remove ...>  (retries 3x, then reports a diagnosis); an environment change is <venv python> -m dev_lab.dev.dep --sync, which retries inside"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m dev_lab.dev.dep --bootstrap <this checkout> --group dev --extra torch  (run from this checkout)"
