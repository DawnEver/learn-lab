[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-lab"
version = "0.1.0"
description = "Learned models: fit and evaluate surrogates, physics-informed fields, learned laws, inverse problems."
readme = "README.md"
# Bounded above by the newest CPython every locked wheel covers: openvino 2026.4.1 ships cp313/cp314 only, and an
# open range let a runner pick 3.15 and fail to install (learn-lab#1, 2026-11-09). Raise it with the lock.
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mingyang Bao" }]
# The public boundary speaks numpy only. torch is the [torch] extra, imported only inside learn_lab.deep
# (tests/architecture/test_the_layers_point_one_way.py), so the response models never load it. The response
# models solve through numerics-lab (the family's equation-solving engine) and read scipy.special only.
# Every learn-lab record -- an artifact's manifest, a fit checkpoint, an export's manifest -- is TOML (family ruling
# 2026-11-25): written by tomlkit, the family's TOML writer (lab-commons[io]), read by stdlib tomllib.
dependencies = [
    "numerics-lab @ git+https://github.com/DawnEver/numerics-lab.git",
    "numpy",
    "scipy",
    "tomlkit",
]

[project.optional-dependencies]
torch = ["torch>=2.7"]
# Inference export (learn_lab.deep.export): ONNX through torch, post-training quantization and the CPU/iGPU/NPU
# runtime through OpenVINO + NNCF. Inference only; training stays on torch.
openvino = ["onnx", "openvino", "nncf"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    # Reference oracles for the self-implemented response models: tests only, never runtime.
    "scikit-learn",
    # The family development system (verify door, rules, hooks). DEV ONLY: learn_lab imports neither dev_lab nor
    # lab_commons. [test] brings the JS engine the agent-guard tests run the guard in (dev_lab.dev.jsrun).
    "dev-lab[test] @ git+https://github.com/DawnEver/dev-lab.git",
]

# One CUDA build serves both platforms: native Windows CUDA (workstations, incl. Blackwell sm_120 which needs
# CUDA >= 12.8; cu130 builds cover it and Ada sm_80) and Linux (Ada A100/H200). macOS falls through to PyPI's CPU wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]
xfail_strict = true

[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
install = 'uv sync --frozen --group dev --extra torch --extra openvino'
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['src']
collect = 'tests'

[tool.dev_lab.parts]
output = "output/logs"

# One verify worker's measured peak: a CUDA torch process commits ~3.3 GB (test_graph, 2026-11-08), so the
# 1 GB unmeasured floor got every deep test killed 0xC0000017 (out of memory) by the box.
[tool.dev_lab.verify]
worker_mem_gb = 3.5
# The one test that needs a CUDA device. GitHub's hosted runners have none and no GPU host produces parts for this
# repo, so it runs where a GPU is (a workstation's verify) and is declared here rather than truncating tests/base
# (user ruling 2026-11-09). Every other CUDA path is exercised on the CPU runtime. verify reads this list; the
# part poster reads the test's not_applicable marker (lab_commons.hpc.pytest_item): the family checks a skip at both.
allowed_skips = ["tests/unit/deep/test_artifact.py::test_a_fit_saved_on_cuda_loads_on_cuda_exactly_and_on_the_cpu_within_float32"]

[tool.lab_commons.tests]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]

[tool.dev_lab.dep]
# Every environment carries both: 21 test files import torch and the export tests importorskip openvino, and no
# test declares a resource marker a need could map to. Moving either behind `needs` first needs those markers.
extras = ["torch", "openvino"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# on a full forge PASS. Past c623e25 (integrate/main created at the founding commits) every commit is a forge merge.
[tool.dev_lab.integrator]
trunk = "main"
integration = "integrate/main"
merges_only_since = "8be94e3889513c57967f1c4bc8f891512fac5a7a"  # INTEGRATION-IS-MERGES-ONLY after the founding commits
pr_merges_since = "c623e25949988135489296ad4562d05334a0dcec"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES after the integration branch was created

# FORGE-PROTECTION-DECLARED (dev_lab.dev.forgeprotect): the bypass identities per forge; on GitHub the
# ops App and the repo admin (integrator ruling 2026-11-10). `python -m dev_lab.dev.forge protect plan|check|apply`.
[tool.dev_lab.protection]
[tool.dev_lab.protection.forges."github.com"]
breakglass = ["app:5704921", "role:admin"]  # the ops App (motronics-ops) merges break-glass; admin stays

# GitHub Actions: the family's one PR lifecycle (dev_lab/dev/ci_base.toml) as is; rendered to
# .github/workflows/ci.yml by `python -m dev_lab.dev.ciworkflows render`, never hand-edited.
[tool.dev_lab.ci."ci.yml"]

# Git hooks: the family base (dev_lab/dev/githooks/base.toml) as is; learn-lab adds no row.
[tool.dev_lab.hooks]

[tool.dev_lab.branchset]
trunk = 'main'
sessions = ['integrate/main']
ephemeral = ['pr/*']  # a PR head: deleted with its merge
prune_merged = true
max_ahead = 30  # an unlanded branch holding more than 30 commits integration lacks is an alarm
max_idle_hours = 24  # a branch idle 24 h is pruned when merged, alarmed when not

[tool.dev_lab.doors]
BARE-TEST-INVOCATION = "<venv python> -m dev_lab.dev.verify -- <paths>  (the measure door; a full run is the forge producer's; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "push without skipping the hook; no hook runs a test, and the forge produces the part"
NETWORK-VERB = "<venv python> -m dev_lab.dev.netverb -- <git push|fetch|pull|clone|ls-remote|submodule update ...  or  uv lock|add|remove ...>  (retries 3x, then reports a diagnosis); an environment change is <venv python> -m dev_lab.dev.dep --sync, which retries inside"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m dev_lab.dev.dep --bootstrap <this checkout>  (run from this checkout; the extras are [tool.dev_lab.dep]'s, and a relock is --lock-upgrade <this checkout>)"

# The family files famfiles renders read their per-repo deltas from this one module.
[tool.dev_lab.render]
deltas = "tests/architecture/_famconfig.py"
adoption = "scripts/deny_rules.py"

# Who reviews this repo's PRs: the family's isolated judge host (user ruling 2026-11-10), gated on GitHub by the
# family App's review/judge check run. Keys and defaults: dev_lab.dev.forgereview_declared.
[tool.dev_lab.review]
judge_app = 5619495

# DECLARED-LAYOUT (dev_lab.dev.layout): the WHOLE tree as an allow-list -- each directory pattern (one glob per
# segment; the deepest matching row judges) and the formats a file there may be ('.suffix', an exact name, "" for
# none, "*" for anything). Undeclared is refused. NO-BACKUP-COPIES: nothing under output/ or scratch/ is ever a
# clone, worktree, exported tree, bundle or patch, whatever a row says. Formats (R3): TOML declarations, JSONL
# machine records, CSV tables, NPZ arrays, Markdown reports, PNG figures; vendor-native only at an adapter boundary.
[tool.dev_lab.placement]
# A worktree is a real second tree, judged by the run inside it.
pruned_paths = ['.claude/worktrees']

[tool.dev_lab.placement.layout]
'.' = ['.md', '.toml', '.lock', '.gitattributes', '.gitignore', '.rgignore', 'license', 'makefile']
'.claude' = ['.json']
'.claude/hooks' = ['.js', '.json']
'.claude/memory' = ['.md']
'.claude/rules' = ['.md']
'.claude/tasks' = ['.md']
'.codex' = []
'.codex/rules' = ['.rules']
'.github' = []
'.github/workflows' = ['.yml']
'docs-src' = ['.md']
'output' = []
'output/forge' = []
'output/forge/*' = ['.json', '.tmp']
'output/logs' = []
'output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/*' = ['.log', '.jsonl', '.json', '.gz', '.coverage', '.txt', '.csv', '.md', '.npz', '.png']
'output/runcache' = ['.jsonl']
'scratch' = ['*']
'scripts' = ['.py']
'src' = ['.py']
'tests' = ['.py']
